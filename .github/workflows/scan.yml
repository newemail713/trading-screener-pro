name: Live Market & Strat Scanner
on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: pip install yfinance pandas numpy
      - name: Run Strat Scanner
        run: python scanner.py
      - name: Save live data
        run: |
          git config user.name "Screener Bot"
          git config user.email "bot@://github.com"
          git add data/
          git commit -m "Update live market data" || exit 0
          git push
